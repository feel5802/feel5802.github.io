<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캡틴필 앱</title>
<style>
  :root { --bg:#FAF8FC; --fg:#1D1B20; --muted:#625B71; --accent:#6750A4; --card:#fff; --line:#E7E0EC; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141218; --fg:#E6E0E9; --muted:#CAC4D0; --accent:#D0BCFF; --card:#1D1B20; --line:#49454F; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.6rem; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .card h2 { font-size:1.15rem; margin:0 0 4px; }
  .card p { margin:0 0 12px; }
  a { color:var(--accent); }
  ul { margin:0; padding-left:20px; }
  footer { margin-top:32px; font-size:.9rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>캡틴필 앱</h1>
  <p>캡틴필이 만드는 Android 앱 안내 페이지입니다.</p>
  <section class="card">
    <h2>사주브리핑</h2>
    <p>절입시각 기준 만세력으로 사주팔자·오행·십성·대운·세운을 쉽게 정리해 주는 앱입니다.</p>
    <ul>
      <li><a href="https://feel5802.github.io/sajubrief-privacy/">개인정보처리방침</a></li>
    </ul>
  </section>
  <footer>문의: <a href="mailto:contact@captainphil.kr">contact@captainphil.kr</a></footer>
</main>
</body>
</html>
